server {
    listen 80;

    # [A9b] résolveur DNS embarqué de Docker + variable : nginx re-résout « api » toutes les 10 s.
    # Sans cela, l'adresse est figée au démarrage (nouveau réplica jamais servi, IP périmée après recréation).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location = /health {
        default_type text/plain;
        return 200 'front ok';
    }

    location / {
        proxy_pass $api;                                  # [A9] et non localhost : c'est le conteneur nginx
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502;       # réplica qui s'arrête : on retente sur un autre
        proxy_connect_timeout 2s;
    }
}
