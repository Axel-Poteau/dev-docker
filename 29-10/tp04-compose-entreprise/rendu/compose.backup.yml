# TP05 — sidecar de sauvegarde planifiée de la base
#   docker compose -f compose.yml -f compose.override.yml -f compose.backup.yml up -d --wait
#   (prod : -f compose.yml -f compose.prod.yml -f compose.backup.yml)
# Dumps dans $BACKUP_DIR/{last,daily,weekly,monthly} avec rotation jours/semaines/mois.
services:
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_EXTRA_OPTS: "--format=custom --compress=6"
      BACKUP_SUFFIX: .dump
      SCHEDULE: "${BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    secrets:
      - db_password
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - back
    healthcheck:
      # celui de l'image (interval 5 min, sans start_period) bloquerait "up --wait" pendant 5 min
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
