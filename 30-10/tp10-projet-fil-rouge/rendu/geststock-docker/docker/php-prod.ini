; PHP de production GestStock (chargé après php.ini-production)
display_errors = Off
display_startup_errors = Off
log_errors = On
; sous Apache, les erreurs PHP partent dans le log d'erreur Apache = stderr du conteneur
error_log =
expose_php = Off
; limites d'upload reprises du serveur legacy
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 128M
max_execution_time = 30
date.timezone = Europe/Paris
session.cookie_httponly = 1
session.use_strict_mode = 1
; mail() → msmtp vers le relais SMTP (remplace le postfix local) ; ${VAR} est lu dans l'environnement
sendmail_path = "/usr/bin/msmtp -t --host=${SMTP_HOST} --port=${SMTP_PORT} --from=${SMTP_FROM} --auth=off --tls=off"
opcache.enable = 1
opcache.validate_timestamps = 0
