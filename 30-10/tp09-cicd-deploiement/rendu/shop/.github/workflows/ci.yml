# Pipeline Shop SAS — rejoué en local par ci-local.sh (mêmes étapes, registre TP03).
#   pull_request : lint (hadolint, compose config) → étape test → build multi-arch SANS push
#   push main    : + push sha-<sha> (GHCR) → trivy bloquant → cosign keyless → déploiement préprod
#   tag v*       : + tags semver → déploiement prod après approbation (environment « production »)
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # une PR mise à jour annule le run précédent ; jamais un déploiement en cours
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: hadolint shopapi
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: apps/shopapi/Dockerfile, config: .hadolint.yaml}
      - name: hadolint shop-worker
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: apps/shop-worker/Dockerfile, config: .hadolint.yaml}
      - name: docker compose config (dev et prod)
        run: |
          docker compose --env-file .env.example config -q
          VERSION=sha-${GITHUB_SHA::7} docker compose --env-file .env.example -f compose.yml -f compose.prod.yml config -q

  build:
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write     # push GHCR
      id-token: write     # jeton OIDC pour la signature cosign keyless
    strategy:
      fail-fast: true
      matrix:
        include:
          - {service: api, context: apps/shopapi, image: shopapi}
          - {service: worker, context: apps/shop-worker, image: shop-worker}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags et labels OCI (politique TP03)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.vendor=Shop SAS

      - name: Étape test (lint + tests unitaires dans le Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: test
          secrets: |
            pipconf=${{ secrets.PIP_CONF }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Login GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch (+ push hors PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          # secret de build : pip.conf (index PyPI interne authentifié), jamais dans une couche
          secrets: |
            pipconf=${{ secrets.PIP_CONF }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Scan trivy bloquant (HIGH/CRITICAL corrigeables)
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Signature APRÈS le scan : une image vulnérable est poussée mais jamais signée,
      # donc jamais déployée (le déploiement vérifie la signature).
      - uses: sigstore/cosign-installer@v3
        if: env.PUSH == 'true'
      - name: Signature cosign keyless (OIDC GitHub → Fulcio, journal Rekor)
        if: env.PUSH == 'true'
        run: cosign sign --yes -a git_sha=${{ github.sha }} "${REGISTRY}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # « production » est configuré avec des reviewers obligatoires : le job attend une approbation
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preprod' }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preprod' }}
      cancel-in-progress: false
    env:
      CONTEXT: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version à déployer
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}; else v=sha-${GITHUB_SHA::7}; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Vérification des signatures (identité = ce workflow, sur main ou un tag)
        run: |
          for img in shopapi shop-worker; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$img:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign verify "$REGISTRY/$img@$digest" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/(heads/main|tags/v.*)$" \
              -a git_sha="$GITHUB_SHA" > /dev/null
            echo "✔ $img@$digest signé par la CI pour $GITHUB_SHA"
          done

      - name: Accès SSH au serveur (clé et empreinte depuis les secrets de l'environnement)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          docker context create "$CONTEXT" --docker "host=ssh://${{ vars.DEPLOY_TARGET }}"

      - name: Rolling update
        run: DOCKER_CONTEXT="$CONTEXT" ./deploy/rolling-update.sh

      - name: Smoke test
        run: BASE_URL="${{ vars.APP_URL }}" COMPOSE="docker --context $CONTEXT compose --env-file deploy/env/$CONTEXT.env -f compose.yml -f compose.prod.yml" ./smoke-test.sh
