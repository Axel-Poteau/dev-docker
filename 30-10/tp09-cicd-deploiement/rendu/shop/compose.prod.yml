# Surcharge PROD : docker compose -f compose.yml -f compose.prod.yml up -d --wait
# Images tirées du registre (TP03), aucun build, aucun port de debug, durcissement des conteneurs.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  proxy:
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]   # écoute sur :80 dans le conteneur
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 128M}

  api:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shopapi:${VERSION:?VERSION doit être défini}
    pull_policy: always
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
    # SIGTERM → drain 5 s (/health en 503) → server.close() → exit ; SIGKILL seulement après 15 s
    stop_grace_period: 15s
    labels:
      # healthcheck actif de Traefik sur la readiness, resserré : un réplica en drain (/ready en 503)
      # est retiré en ≤ 2 s, avant la fin du drain (5 s)
      traefik.http.services.api.loadbalancer.healthcheck.path: /ready
      traefik.http.services.api.loadbalancer.healthcheck.interval: 2s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 1s
      # une connexion refusée par un réplica qui s'arrête est rejouée sur un autre réplica
      traefik.http.middlewares.api-retry.retry.attempts: "3"
      traefik.http.middlewares.api-retry.retry.initialinterval: 100ms
      traefik.http.routers.api.middlewares: api-retry
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "0.50", memory: 256M}
        reservations: {memory: 64M}

  worker:
    <<: *hardening
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shop-worker:${VERSION:?VERSION doit être défini}
    pull_policy: always
    stop_grace_period: 15s
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 128M}

  db:
    # l'entrypoint postgres démarre en root puis bascule sur l'utilisateur postgres : capacités minimales
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  redis:
    <<: *hardening
    # démarrage direct en utilisateur redis : l'entrypoint ne tente plus de chown en root (impossible sans capacités)
    user: redis
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 128M}
