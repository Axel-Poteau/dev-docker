# Stack Shop SAS — fichier de BASE commun à tous les environnements.
#   dev  : docker compose up -d --wait                      (+ compose.override.yml, appliqué automatiquement)
#   prod : docker compose -f compose.yml -f compose.prod.yml up -d --wait
name: shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging

# L'application ne lit que DATABASE_URL : on la construit au démarrage à partir du secret monté,
# puis "exec" remplace le shell par le processus applicatif (PID 1, reçoit SIGTERM).
x-database-url-entrypoint: &database-url-entrypoint
  - /bin/sh
  - -c
  - 'export DATABASE_URL="postgres://$${DB_USER}:$$(cat /run/secrets/db_password)@$${DB_HOST}:5432/$${DB_NAME}"; exec "$$@"'
  - --

x-database-env: &database-env
  DB_HOST: db
  DB_USER: shop
  DB_NAME: shop
  REDIS_URL: redis://redis:6379

services:
  proxy:
    <<: *service-defaults
    image: traefik:v3.1.7
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: shop_front
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_PING: "true"
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      TRAEFIK_LOG_LEVEL: INFO
    volumes:
      # lecture seule ; en prod, préférer un docker-socket-proxy qui n'expose que GET /containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  api:
    <<: *service-defaults
    build:
      context: apps/shopapi
      args:
        APP_VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ${REGISTRY:-localhost:5000}/shopapi:${VERSION:-dev}
    entrypoint: *database-url-entrypoint
    command: ["node", "src/server.js"]
    environment:
      <<: *database-env
      LOG_LEVEL: info
    secrets:
      - db_password
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`api.localhost`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s

  worker:
    <<: *service-defaults
    build:
      context: apps/shop-worker
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
      secrets:
        - pipconf
    image: ${REGISTRY:-localhost:5000}/shop-worker:${VERSION:-dev}
    entrypoint: *database-url-entrypoint
    command: ["python", "-m", "worker.main"]
    environment:
      <<: *database-env
    secrets:
      - db_password
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]

  db:
    <<: *service-defaults
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DB_INIT_DIR / SECRETS_DIR : chemins sur l'hôte Docker qui exécute (absolus sur le serveur distant)
      - ${DB_INIT_DIR:-./db}/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  # ---- Outils à la demande -------------------------------------------------
  adminer:
    <<: *service-defaults
    profiles: ["tools"]
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.localhost`)
      traefik.http.routers.adminer.entrypoints: web
      traefik.http.services.adminer.loadbalancer.server.port: "8080"

  # MIGRATION=002-add-sku.sql docker compose run --rm migrate
  migrate:
    profiles: ["ops"]
    image: postgres:16.4-alpine
    restart: "no"
    logging: *logging
    entrypoint:
      - /bin/sh
      - -c
      - 'PGPASSWORD="$$(cat /run/secrets/db_password)" exec psql -h db -U shop -d shop -v ON_ERROR_STOP=1 -f "/migrations/$${MIGRATION:?variable MIGRATION requise}"'
    environment:
      MIGRATION: ${MIGRATION:-}
    secrets:
      - db_password
    volumes:
      - ${DB_INIT_DIR:-./db}/migrations:/migrations:ro
    networks:
      - back
    depends_on:
      db:
        condition: service_healthy

networks:
  front: {}
  back:
    internal: true   # pas de route vers l'extérieur : db/redis injoignables depuis l'hôte et Internet

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password.txt
  pipconf:
    file: ./apps/shop-worker/pip.conf
